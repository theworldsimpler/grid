<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Inter Display', sans-serif;
    }

    body {
      padding: 40px;
      line-height: 1.4;
    }

    .section {
      max-width: 1100px;
      margin: 0 0 70px 0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin: 0 0 24px 0;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.4;
      margin: 0 0 18px 0;
    }

    .download-button {
      display: inline-block;
      background-color: #007AFF;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    #status {
      margin-bottom: 16px;
      font-size: 1rem;
      color: #555;
    }

    #map {
      width: 100%;
      height: 75vh;
      min-height: 650px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #eeeeee;
    }

    .price-annotation {
      min-width: 72px;
      min-height: 44px;
      padding: 4px 8px;
      border: none;
      border-radius: 999px;
      background: #007AFF;
      color: #FFFFFF;
      font-family: 'Inter Display', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      transform: translate(-50%, -50%);
    }

    .price-annotation:hover {
      background: #006EE6;
    }

    .listing-callout {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 220px;
      max-width: 300px;
      font-size: 14px;
      line-height: 1.35;
    }

    .listing-callout-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .listing-callout-row {
      margin: 4px 0;
    }

    .listing-callout a {
      color: #007AFF;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px;
      }

      #map {
        height: 70vh;
        min-height: 520px;
      }
    }
  </style>
</head>

<body>

  <div class="section">
    <h1>Grid</h1>
    <a class="download-button" href="https://apps.apple.com/app/id6773366221">App Store</a>
  </div>

  <div class="section">
  <div id="status" hidden></div>
  <div id="map"></div>
</div>

  <div class="section">
    <h1>Support</h1>
    <p>Refer to Grid.</p>
  </div>

  <div class="section">
    <h1>Marketing</h1>
    <p>Refer to the App Store.</p>
  </div>

  <div class="section">
    <h1>Privacy Policy</h1>
    <p>Refer to Grid.</p>
  </div>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>

  <script>
    const CLOUDKIT_CONTAINER_ID = "iCloud.Grid";
    const CLOUDKIT_API_TOKEN = "e73d68b176aa0efd24dde0748e2619b584e9e9a05ed0d9f6313c4d662b345e1e";
    const CLOUDKIT_ENVIRONMENT = "production";

    const MAPKIT_TOKENS = {
      "theworldsimpler.com": "eyJraWQiOiJYUzdER0dMNllZIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiI3NDk2UThGQUgzIiwiaWF0IjoxNzgyMTQ2Mjg5LCJvcmlnaW4iOiJ0aGV3b3JsZHNpbXBsZXIuY29tIiwic2NvcGUiOiJtYXBraXRfanMifQ.pOyZBMqBu5QVFpY4ZkWIiB0oTAnVzSeu0S8ZHINMiqqKeb7PmI99tN5Sm5SyDWPOar4jYAYwh_FEvmb-WKaFkg",
      "theworldsimpler.github.io": "eyJraWQiOiJaNVg5TUQzTUhTIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiI3NDk2UThGQUgzIiwiaWF0IjoxNzgyMTQ2Mjg5LCJvcmlnaW4iOiJ0aGV3b3JsZHNpbXBsZXIuZ2l0aHViLmlvIiwic2NvcGUiOiJtYXBraXRfanMifQ.RzK7_nMRgzcdZSEfLcWOz-B6iG0iFQXzYKyia1bCmKxcw6j-pJxtRxXQsvyJadbr4KL9Oxxq-NsghZMi8CYsLQ"
    };

    const MAPKIT_TOKEN = MAPKIT_TOKENS[window.location.hostname];
    const statusEl = document.getElementById("status");

    if (!MAPKIT_TOKEN) {
      statusEl.textContent = "Missing MapKit token for this domain.";
    }

    CloudKit.configure({
      containers: [
        {
          containerIdentifier: CLOUDKIT_CONTAINER_ID,
          environment: CLOUDKIT_ENVIRONMENT,
          apiTokenAuth: {
            apiToken: CLOUDKIT_API_TOKEN,
            persist: true
          }
        }
      ]
    });

    mapkit.init({
      authorizationCallback: function(done) {
        done(MAPKIT_TOKEN);
      }
    });

    const hybridMapType =
      mapkit.Map?.MapTypes?.Hybrid ||
      mapkit.MapType?.Hybrid ||
      "hybrid";

    const map = new mapkit.Map("map", {
      isRotationEnabled: true
    });

    map.mapType = hybridMapType;
    map.showsCompass = mapkit.FeatureVisibility.Visible;
    map.showsZoomControl = true;
    map.showsMapTypeControl = true;
    map.showsScale = mapkit.FeatureVisibility.Visible;

    applyClosestWeb3DSettings();
    setStartupZoomedOutRegion();

    async function loadBorders() {
      try {
        const container = CloudKit.getDefaultContainer();
        const database = container.publicCloudDatabase;

        const response = await database.performQuery({
          recordType: "Border",
          desiredKeys: [
            "points",
            "price",
            "owner",
            "contact",
            "address",
            "description",
            "link",
            "areaText",
            "createdDate",
            "expiryDate"
          ]
        });

        const records = response.records || [];

        const overlays = [];
        const annotations = [];

        records.forEach(record => {
          const fields = record.fields || {};
          const points = getPoints(fields.points);

          if (points.length < 3) {
            return;
          }

          const coordinates = points.map(point => {
            return new mapkit.Coordinate(point[0], point[1]);
          });

          const price = getValue(fields.price);
          const owner = getValue(fields.owner);
          const contact = getValue(fields.contact);
          const address = getValue(fields.address);
          const description = getValue(fields.description);
          const link = getValue(fields.link);

          const polygon = new mapkit.PolygonOverlay(coordinates);

          polygon.style = new mapkit.Style({
            strokeColor: "#007AFF",
            lineWidth: 3,
            fillColor: "rgba(0, 122, 255, 0.25)"
          });

          overlays.push(polygon);

          const center = polygonCenter(points);

          const annotation = createPriceAnnotation(
            new mapkit.Coordinate(center.latitude, center.longitude),
            price,
            {
              price,
              owner,
              contact,
              address,
              description,
              link
            }
          );

          annotations.push(annotation);
        });

        if (overlays.length > 0) {
          map.addOverlays(overlays);
          map.addAnnotations(annotations);

          map.mapType = hybridMapType;
          applyClosestWeb3DSettings();
          setStartupZoomedOutRegion();

          statusEl.textContent = `Showing ${overlays.length} Grid listing${overlays.length === 1 ? "" : "s"}.`;
        } else {
          statusEl.textContent = "No Grid listings found yet.";
          setStartupZoomedOutRegion();
        }

      } catch (error) {
  console.error(error);
  statusEl.textContent = "Could not load Grid listings: " + (error.message || error);
  setStartupZoomedOutRegion();
}
    }

    function createPriceAnnotation(coordinate, price, data) {
      const displayPrice = price && String(price).trim().length > 0 ? price : "—";

      const annotation = new mapkit.Annotation(
        coordinate,
        function(_, options) {
          const element = document.createElement("button");
          element.className = "price-annotation";
          element.type = "button";
          element.textContent = options.displayPrice || "—";
          element.setAttribute("aria-label", `Grid listing ${options.displayPrice || "—"}`);
          return element;
        },
        {
          displayPrice
        }
      );

      annotation.title = displayPrice;
      annotation.subtitle =
        data.address ||
        data.description ||
        data.owner ||
        data.contact ||
        "Grid Listing";

      annotation.data = data;
      annotation.callout = listingCalloutDelegate;

      return annotation;
    }

    const listingCalloutDelegate = {
      calloutContentForAnnotation: function(annotation) {
        const data = annotation.data || {};
        const container = document.createElement("div");
        container.className = "listing-callout";

        const title = document.createElement("div");
        title.className = "listing-callout-title";
        title.textContent = "Grid Listing";
        container.appendChild(title);

        addCalloutRow(container, "Price", data.price);
        addCalloutRow(container, "Owner", data.owner);
        addCalloutRow(container, "Contact", data.contact);
        addCalloutRow(container, "Address", data.address);
        addCalloutRow(container, "Description", data.description);

        if (data.link) {
          const row = document.createElement("div");
          row.className = "listing-callout-row";

          const strong = document.createElement("strong");
          strong.textContent = "Link: ";

          const anchor = document.createElement("a");
          anchor.href = data.link;
          anchor.target = "_blank";
          anchor.rel = "noopener";
          anchor.textContent = "Open";

          row.appendChild(strong);
          row.appendChild(anchor);
          container.appendChild(row);
        }

        return container;
      }
    };

    function addCalloutRow(container, label, value) {
      if (!value) {
        return;
      }

      const row = document.createElement("div");
      row.className = "listing-callout-row";

      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;

      const span = document.createElement("span");
      span.textContent = value;

      row.appendChild(strong);
      row.appendChild(span);
      container.appendChild(row);
    }

    function setStartupZoomedOutRegion() {
      map.region = new mapkit.CoordinateRegion(
        new mapkit.Coordinate(0, 0),
        new mapkit.CoordinateSpan(90, 180)
      );
    }

    function applyClosestWeb3DSettings() {
      map.mapType = hybridMapType;

      if ("showsBuildings" in map) {
        map.showsBuildings = true;
      }

      if ("isRotationEnabled" in map) {
        map.isRotationEnabled = true;
      }

      if ("isPitchEnabled" in map) {
        map.isPitchEnabled = true;
      }

      if ("pitch" in map) {
        map.pitch = 55;
      }

      if ("cameraDistance" in map) {
        map.cameraDistance = 12000;
      }
    }

    function getValue(field) {
      if (!field || field.value === undefined || field.value === null) {
        return "";
      }

      return field.value;
    }

    function getPoints(field) {
      const rawPoints = getValue(field);

      if (!Array.isArray(rawPoints)) {
        return [];
      }

      return rawPoints
        .map(point => {
          if (
            typeof point.latitude === "number" &&
            typeof point.longitude === "number"
          ) {
            return [point.latitude, point.longitude];
          }

          if (
            point.value &&
            typeof point.value.latitude === "number" &&
            typeof point.value.longitude === "number"
          ) {
            return [point.value.latitude, point.value.longitude];
          }

          return null;
        })
        .filter(Boolean);
    }

    function polygonCenter(points) {
      let latitude = 0;
      let longitude = 0;

      points.forEach(point => {
        latitude += point[0];
        longitude += point[1];
      });

      return {
        latitude: latitude / points.length,
        longitude: longitude / points.length
      };
    }

    loadBorders();
  </script>

</body>
</html>
