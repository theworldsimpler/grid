<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Inter Display', sans-serif;
    }

    body {
      padding: 40px;
      line-height: 1.4;
    }

    .section {
      max-width: 900px;
      margin: 0 0 70px 0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin: 0 0 24px 0;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.4;
      margin: 0;
    }

    .download-button {
      display: inline-block;
      background-color: #007AFF;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="section">
    <h1>Grid</h1>
    <a class="download-button" href="https://apps.apple.com/app/id6773366221">App Store</a>
  </div>

  <div class="section">
    <h1>Support</h1>

  </div>
