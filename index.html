<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grid</title>

  <meta http-equiv="refresh" content="0; url=./Grid.pdf">

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <script>
    (() => {
      let path = window.location.pathname;

      if (path.endsWith("/index.html")) {
        path = path.slice(0, -"index.html".length);
      } else if (!path.endsWith("/")) {
        path += "/";
      }

      window.location.replace(
        `${path}Grid.pdf${window.location.search}${window.location.hash}`
      );
    })();
  </script>

  <noscript>
    <a href="./Grid.pdf">Open the Grid PDF</a>
  </noscript>
</body>
</html>
