<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Inter Display', sans-serif;
    }

    body {
      padding: 40px;
      line-height: 1.4;
    }

    .section {
      max-width: 1100px;
      margin: 0 0 70px 0;
    }

    .map-section {
      max-width: none;
      width: calc(100vw - 80px);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin: 0 0 24px 0;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.4;
      margin: 0 0 18px 0;
    }

    .download-button,
    .toolbar-button,
    .panel-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #007AFF;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      font-family: inherit;
    }

    .toolbar-button.secondary,
    .panel-button.secondary {
      background-color: #F2F2F7;
      color: #000000;
    }

    .toolbar-button.danger,
    .panel-button.danger {
      background-color: #FF3B30;
      color: #FFFFFF;
    }

    #toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    #status {
      margin-bottom: 16px;
      font-size: 1rem;
      color: #555;
    }

    #map {
      width: 100%;
      height: 75vh;
      min-height: 650px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ddd;
      background: #eeeeee;
    }

    .price-annotation {
      min-width: 72px;
      min-height: 44px;
      padding: 4px 8px;
      border: none;
      border-radius: 999px;
      background: #007AFF;
      color: #FFFFFF;
      font-family: 'Inter Display', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: none;
      transform: translate(-50%, -50%);
    }

    .price-annotation:hover {
      background: #006EE6;
    }

    .corner-annotation {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 2px solid #007AFF;
      transform: translate(-50%, -50%);
    }

    .search-annotation {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #FF3B30;
      border: 3px solid #FFFFFF;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
      transform: translate(-50%, -50%);
    }

    .listing-callout {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-width: 220px;
      max-width: 300px;
      font-size: 14px;
      line-height: 1.35;
    }

    .listing-callout-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .listing-callout-row {
      margin: 4px 0;
    }

    .listing-callout a {
      color: #007AFF;
      text-decoration: none;
    }

    .panel-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }

    .panel-backdrop.active {
      display: flex;
    }

    .panel {
      width: min(520px, 100%);
      background: #FFFFFF;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 60px rgba(0,0,0,0.25);
    }

    .panel h2 {
      margin: 0 0 18px 0;
      font-size: 1.6rem;
      line-height: 1.1;
    }

    .panel label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin: 14px 0 6px 0;
    }

    .panel input,
    .panel textarea {
      width: 100%;
      font: inherit;
      border: 1px solid #D1D1D6;
      border-radius: 10px;
      padding: 10px 12px;
      outline: none;
    }

    .panel textarea {
      min-height: 90px;
      resize: vertical;
    }

    .panel-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .small-note {
      color: #666;
      font-size: 0.95rem;
      margin-top: 10px;
    }

    .icloud-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin: 18px 0;
    }

    @media (max-width: 700px) {
      body {
        padding: 24px;
      }

      .map-section {
        width: calc(100vw - 48px);
      }

      #map {
        height: 70vh;
        min-height: 520px;
      }

      .toolbar-button {
        flex: 1 1 calc(50% - 8px);
      }
    }
  </style>
</head>

<body>

  <div class="section">
    <h1>Grid</h1>
    <a class="download-button" href="https://apps.apple.com/app/id6773366221">App Store</a>
  </div>

  <div class="section map-section">
    <div id="toolbar">
      <button class="toolbar-button secondary" id="searchButton">Search</button>
      <button class="toolbar-button secondary" id="locateButton">Locate</button>
      <button class="toolbar-button" id="postButton">Post</button>
      <button class="toolbar-button danger" id="clearButton">Clear</button>
      <button class="toolbar-button secondary" id="accountButton">Account</button>
    </div>

    <div id="status" hidden></div>
    <div id="map"></div>
  </div>

  <div class="section">
    <h1>Support</h1>
    <p>Refer to Grid.</p>
  </div>

  <div class="section">
    <h1>Marketing</h1>
    <p>Refer to the App Store.</p>
  </div>

  <div class="section">
    <h1>Privacy Policy</h1>
    <p>Refer to Grid.</p>
  </div>

  <div class="panel-backdrop" id="searchPanel">
    <div class="panel">
      <h2>Search</h2>
      <input id="searchInput" placeholder="Search address or city">
      <div class="panel-actions">
        <button class="panel-button" id="runSearchButton">Search</button>
        <button class="panel-button secondary" data-close-panel>Cancel</button>
      </div>
      <div class="small-note">Search results are shown on the map.</div>
    </div>
  </div>

  <div class="panel-backdrop" id="postPanel">
    <div class="panel">
      <h2>Post Listing</h2>

      <label>Owner</label>
      <input id="ownerInput" maxlength="250">

      <label>Price</label>
      <input id="priceInput" maxlength="250" placeholder="$500,000">

      <label>Contact</label>
      <input id="contactInput" maxlength="250">

      <label>Address</label>
      <input id="addressInput" maxlength="250">

      <label>Description</label>
      <textarea id="descriptionInput" maxlength="250"></textarea>

      <label>Link</label>
      <input id="linkInput" maxlength="250">

      <label>Expiry Date</label>
      <input id="expiryInput" type="date">

      <div class="panel-actions">
        <button class="panel-button" id="saveListingButton">Post</button>
        <button class="panel-button secondary" data-close-panel>Cancel</button>
      </div>

      <div class="small-note" id="postNote">Tap at least 3 points on the map to create a border.</div>
    </div>
  </div>

  <div class="panel-backdrop" id="accountPanel">
    <div class="panel">
      <h2>Account</h2>
      <p id="accountStatus">Checking iCloud status...</p>

      <div class="icloud-buttons">
        <div id="apple-sign-in-button"></div>
        <div id="apple-sign-out-button"></div>
      </div>

      <div class="panel-actions">
        <button class="panel-button secondary" data-close-panel>Close</button>
      </div>
    </div>
  </div>

  <script>
    const needsHttps = location.protocol !== "https:";
    const needsGridSlash = location.pathname === "/grid";
    const needsNoWww = location.hostname === "www.theworldsimpler.com";

    if (needsHttps || needsGridSlash || needsNoWww) {
      location.replace(
        "https://" +
        (needsNoWww ? "theworldsimpler.com" : location.hostname) +
        (needsGridSlash ? "/grid/" : location.pathname) +
        location.search +
        location.hash
      );
    }
  </script>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="https://cdn.apple-mapkit.com/mk/5.x.x/mapkit.js"></script>

  <script>
    const CLOUDKIT_CONTAINER_ID = "iCloud.Grid";
    const CLOUDKIT_API_TOKEN = "e73d68b176aa0efd24dde0748e2619b584e9e9a05ed0d9f6313c4d662b345e1e";
    const CLOUDKIT_ENVIRONMENT = "production";

    const MAPKIT_TOKENS = {
      "theworldsimpler.com": "eyJraWQiOiJYUzdER0dMNllZIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiI3NDk2UThGQUgzIiwiaWF0IjoxNzgyMTQ2Mjg5LCJvcmlnaW4iOiJ0aGV3b3JsZHNpbXBsZXIuY29tIiwic2NvcGUiOiJtYXBraXRfanMifQ.pOyZBMqBu5QVFpY4ZkWIiB0oTAnVzSeu0S8ZHINMiqqKeb7PmI99tN5Sm5SyDWPOar4jYAYwh_FEvmb-WKaFkg",
      "theworldsimpler.github.io": "eyJraWQiOiJaNVg5TUQzTUhTIiwidHlwIjoiSldUIiwiYWxnIjoiRVMyNTYifQ.eyJpc3MiOiI3NDk2UThGQUgzIiwiaWF0IjoxNzgyMTQ2Mjg5LCJvcmlnaW4iOiJ0aGV3b3JsZHNpbXBsZXIuZ2l0aHViLmlvIiwic2NvcGUiOiJtYXBraXRfanMifQ.RzK7_nMRgzcdZSEfLcWOz-B6iG0iFQXzYKyia1bCmKxcw6j-pJxtRxXQsvyJadbr4KL9Oxxq-NsghZMi8CYsLQ"
    };

    const MAPKIT_TOKEN = MAPKIT_TOKENS[window.location.hostname];

    const statusEl = document.getElementById("status");
    const accountStatusEl = document.getElementById("accountStatus");

    let container;
    let publicDatabase;
    let currentUserIdentity = null;

    let savedOverlays = [];
    let savedAnnotations = [];
    let currentPoints = [];
    let currentPreviewOverlays = [];
    let currentCornerAnnotations = [];
    let searchAnnotation = null;

    if (!MAPKIT_TOKEN) {
      showStatus("Missing MapKit token for this domain.");
    }

    CloudKit.configure({
      containers: [
        {
          containerIdentifier: CLOUDKIT_CONTAINER_ID,
          environment: CLOUDKIT_ENVIRONMENT,
          apiTokenAuth: {
            apiToken: CLOUDKIT_API_TOKEN,
            persist: true
          },
          auth: {
            signInButton: {
              id: "apple-sign-in-button",
              theme: "black"
            },
            signOutButton: {
              id: "apple-sign-out-button",
              theme: "black"
            }
          }
        }
      ]
    });

    container = CloudKit.getDefaultContainer();
    publicDatabase = container.publicCloudDatabase;

    mapkit.init({
      authorizationCallback: function(done) {
        done(MAPKIT_TOKEN);
      }
    });

    const hybridMapType =
      mapkit.Map?.MapTypes?.Hybrid ||
      mapkit.MapType?.Hybrid ||
      "hybrid";

    const map = new mapkit.Map("map", {
      isRotationEnabled: true
    });

    map.mapType = hybridMapType;
    map.showsCompass = mapkit.FeatureVisibility.Visible;
    map.showsZoomControl = true;
    map.showsMapTypeControl = true;
    map.showsScale = mapkit.FeatureVisibility.Visible;

    applyMapSettings();
    setStartupZoomedOutRegion();
    setDefaultExpiryDate();

    document.getElementById("searchButton").addEventListener("click", () => openPanel("searchPanel"));
    document.getElementById("locateButton").addEventListener("click", locateUser);
    document.getElementById("postButton").addEventListener("click", openPostPanel);
    document.getElementById("clearButton").addEventListener("click", clearCurrentBorder);
    document.getElementById("accountButton").addEventListener("click", openAccountPanel);
    document.getElementById("runSearchButton").addEventListener("click", runSearch);
    document.getElementById("saveListingButton").addEventListener("click", saveListing);

    document.querySelectorAll("[data-close-panel]").forEach(button => {
      button.addEventListener("click", closePanels);
    });

    document.querySelectorAll(".panel-backdrop").forEach(panel => {
      panel.addEventListener("click", event => {
        if (event.target === panel) {
          closePanels();
        }
      });
    });

    document.getElementById("searchInput").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        runSearch();
      }
    });

    document.getElementById("map").addEventListener("click", handleMapClick);

    initializeAuth();
    loadBorders();

    async function initializeAuth() {
      try {
        await refreshUserIdentity();

        if (typeof container.whenUserSignsIn === "function") {
          container.whenUserSignsIn().then(identity => {
            currentUserIdentity = identity;
            updateAccountStatus();
            initializeAuthWatchersAgain();
          });
        }

        if (typeof container.whenUserSignsOut === "function") {
          container.whenUserSignsOut().then(() => {
            currentUserIdentity = null;
            updateAccountStatus();
            initializeAuthWatchersAgain();
          });
        }
      } catch (error) {
        console.error(error);
        updateAccountStatus();
      }
    }

    function initializeAuthWatchersAgain() {
      setTimeout(() => {
        initializeAuth();
      }, 500);
    }

    async function refreshUserIdentity() {
      try {
        if (typeof container.setUpAuth === "function") {
          const identity = await container.setUpAuth();
          currentUserIdentity = identity || null;
        }
      } catch (error) {
        console.error(error);
        currentUserIdentity = null;
      }

      updateAccountStatus();
      return currentUserIdentity;
    }

    function updateAccountStatus() {
      const recordName = getUserRecordName();

      if (recordName) {
        accountStatusEl.textContent = "Signed in with iCloud.";
      } else {
        accountStatusEl.textContent = "Not signed in.";
      }
    }

    function getUserRecordName() {
      if (!currentUserIdentity) {
        return "";
      }

      return (
        currentUserIdentity.userRecordName ||
        currentUserIdentity.recordName ||
        currentUserIdentity.userRecordID?.recordName ||
        currentUserIdentity.userRecord?.recordName ||
        ""
      );
    }

    async function loadBorders() {
      try {
        const response = await publicDatabase.performQuery({
          recordType: "Border",
          desiredKeys: [
            "points",
            "price",
            "owner",
            "contact",
            "address",
            "description",
            "link",
            "areaText",
            "createdDate",
            "expiryDate"
          ]
        });

        const records = response.records || [];

        removeSavedMapItems();

        records.forEach(record => {
          const fields = record.fields || {};
          const points = getPoints(fields.points);

          if (points.length < 3) {
            return;
          }

          const coordinates = points.map(point => {
            return new mapkit.Coordinate(point[0], point[1]);
          });

          const price = getValue(fields.price);
          const owner = getValue(fields.owner);
          const contact = getValue(fields.contact);
          const address = getValue(fields.address);
          const description = getValue(fields.description);
          const link = getValue(fields.link);

          const polygon = new mapkit.PolygonOverlay(coordinates);

          polygon.style = new mapkit.Style({
            strokeColor: "#007AFF",
            lineWidth: 3,
            fillColor: "rgba(0, 122, 255, 0.25)"
          });

          savedOverlays.push(polygon);

          const center = polygonCenter(points);

          const annotation = createPriceAnnotation(
            new mapkit.Coordinate(center.latitude, center.longitude),
            price,
            {
              price,
              owner,
              contact,
              address,
              description,
              link
            }
          );

          savedAnnotations.push(annotation);
        });

        if (savedOverlays.length > 0) {
          map.addOverlays(savedOverlays);
          map.addAnnotations(savedAnnotations);
          applyMapSettings();
          setStartupZoomedOutRegion();
        } else {
          setStartupZoomedOutRegion();
        }
      } catch (error) {
        console.error(error);
        showStatus("Could not load Grid listings: " + (error.message || error));
        setStartupZoomedOutRegion();
      }
    }

    function removeSavedMapItems() {
      if (savedOverlays.length > 0) {
        map.removeOverlays(savedOverlays);
      }

      if (savedAnnotations.length > 0) {
        map.removeAnnotations(savedAnnotations);
      }

      savedOverlays = [];
      savedAnnotations = [];
    }

    function handleMapClick(event) {
      if (event.target.closest(".price-annotation")) {
        return;
      }

      if (event.target.closest("button")) {
        return;
      }

      const coordinate = map.convertPointOnPageToCoordinate(
        new DOMPoint(event.pageX, event.pageY)
      );

      if (!coordinate || currentPoints.length >= 9) {
        return;
      }

      currentPoints.push({
        latitude: coordinate.latitude,
        longitude: coordinate.longitude
      });

      updateCurrentBorderPreview();
    }

    function updateCurrentBorderPreview() {
      clearCurrentPreviewOnly();

      const coordinates = currentPoints.map(point => {
        return new mapkit.Coordinate(point.latitude, point.longitude);
      });

      if (coordinates.length >= 2) {
        const line = new mapkit.PolylineOverlay(coordinates);
        line.style = new mapkit.Style({
          strokeColor: "#007AFF",
          lineWidth: 4
        });
        currentPreviewOverlays.push(line);
      }

      if (coordinates.length >= 3) {
        const polygon = new mapkit.PolygonOverlay(coordinates);
        polygon.style = new mapkit.Style({
          strokeColor: "#007AFF",
          lineWidth: 4,
          fillColor: "rgba(0, 122, 255, 0.30)"
        });
        currentPreviewOverlays.push(polygon);
      }

      currentPoints.forEach(point => {
        const annotation = new mapkit.Annotation(
          new mapkit.Coordinate(point.latitude, point.longitude),
          function() {
            const element = document.createElement("div");
            element.className = "corner-annotation";
            return element;
          }
        );

        currentCornerAnnotations.push(annotation);
      });

      if (currentPreviewOverlays.length > 0) {
        map.addOverlays(currentPreviewOverlays);
      }

      if (currentCornerAnnotations.length > 0) {
        map.addAnnotations(currentCornerAnnotations);
      }
    }

    function clearCurrentBorder() {
      currentPoints = [];
      clearCurrentPreviewOnly();
      showStatus("");
    }

    function clearCurrentPreviewOnly() {
      if (currentPreviewOverlays.length > 0) {
        map.removeOverlays(currentPreviewOverlays);
      }

      if (currentCornerAnnotations.length > 0) {
        map.removeAnnotations(currentCornerAnnotations);
      }

      currentPreviewOverlays = [];
      currentCornerAnnotations = [];
    }

    function openPostPanel() {
      if (currentPoints.length < 3) {
        showStatus("Tap at least 3 points on the map before posting.");
        return;
      }

      openPanel("postPanel");
    }

    async function saveListing() {
      try {
        if (currentPoints.length < 3) {
          showStatus("Tap at least 3 points on the map before posting.");
          return;
        }

        await refreshUserIdentity();

        if (!getUserRecordName()) {
          showStatus("Sign in with iCloud before posting.");
          openAccountPanel();
          return;
        }

        const now = new Date();
        const expiryValue = document.getElementById("expiryInput").value;
        const expiryDate = expiryValue
          ? new Date(expiryValue + "T23:59:59")
          : new Date(now.getTime() + 365 * 24 * 3600 * 1000);

        const record = {
          recordType: "Border",
          fields: {
            points: {
              value: currentPoints.map(point => ({
                latitude: point.latitude,
                longitude: point.longitude
              }))
            },
            owner: { value: textValue("ownerInput") },
            price: { value: textValue("priceInput") },
            contact: { value: textValue("contactInput") },
            address: { value: textValue("addressInput") },
            description: { value: textValue("descriptionInput") },
            link: { value: textValue("linkInput") },
            areaText: { value: "" },
            creatorID: { value: getUserRecordName() },
            createdDate: { value: now.getTime() },
            expiryDate: { value: expiryDate.getTime() }
          }
        };

        await publicDatabase.saveRecords(record);

        closePanels();
        clearPostFields();
        clearCurrentBorder();
        await loadBorders();

        showStatus("Listing posted.");
      } catch (error) {
        console.error(error);
        showStatus("Could not post listing: " + (error.message || error));
      }
    }

    function clearPostFields() {
      [
        "ownerInput",
        "priceInput",
        "contactInput",
        "addressInput",
        "descriptionInput",
        "linkInput"
      ].forEach(id => {
        document.getElementById(id).value = "";
      });

      setDefaultExpiryDate();
    }

    function setDefaultExpiryDate() {
      const date = new Date(Date.now() + 365 * 24 * 3600 * 1000);
      document.getElementById("expiryInput").value = date.toISOString().split("T")[0];
    }

    function textValue(id) {
      return document.getElementById(id).value.trim().slice(0, 250);
    }

    function runSearch() {
      const query = document.getElementById("searchInput").value.trim();

      if (!query) {
        return;
      }

      const search = new mapkit.Search({
        region: map.region
      });

      search.search(query, function(error, data) {
        if (error) {
          console.error(error);
          showStatus("Search failed.");
          return;
        }

        const place = data.places && data.places[0];

        if (!place || !place.coordinate) {
          showStatus("No search result found.");
          return;
        }

        if (searchAnnotation) {
          map.removeAnnotation(searchAnnotation);
        }

        searchAnnotation = new mapkit.Annotation(
          place.coordinate,
          function() {
            const element = document.createElement("div");
            element.className = "search-annotation";
            return element;
          }
        );

        searchAnnotation.title = place.name || query;

        map.addAnnotation(searchAnnotation);

        map.region = new mapkit.CoordinateRegion(
          place.coordinate,
          new mapkit.CoordinateSpan(0.05, 0.05)
        );

        closePanels();
      });
    }

    function locateUser() {
      if (!navigator.geolocation) {
        showStatus("Location is not available in this browser.");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const coordinate = new mapkit.Coordinate(
            position.coords.latitude,
            position.coords.longitude
          );

          map.region = new mapkit.CoordinateRegion(
            coordinate,
            new mapkit.CoordinateSpan(0.05, 0.05)
          );
        },
        error => {
          console.error(error);
          showStatus("Could not find your location.");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    async function openAccountPanel() {
      updateAccountStatus();
      openPanel("accountPanel");
      await refreshUserIdentity();
    }

    function openPanel(id) {
      closePanels();
      document.getElementById(id).classList.add("active");
    }

    function closePanels() {
      document.querySelectorAll(".panel-backdrop").forEach(panel => {
        panel.classList.remove("active");
      });
    }

    function createPriceAnnotation(coordinate, price, data) {
      const displayPrice = price && String(price).trim().length > 0 ? price : "—";

      const annotation = new mapkit.Annotation(
        coordinate,
        function(_, options) {
          const element = document.createElement("button");
          element.className = "price-annotation";
          element.type = "button";
          element.textContent = options.displayPrice || "—";
          element.setAttribute("aria-label", `Grid listing ${options.displayPrice || "—"}`);
          return element;
        },
        {
          displayPrice
        }
      );

      annotation.title = displayPrice;
      annotation.subtitle =
        data.address ||
        data.description ||
        data.owner ||
        data.contact ||
        "Grid Listing";

      annotation.data = data;
      annotation.callout = listingCalloutDelegate;

      return annotation;
    }

    const listingCalloutDelegate = {
      calloutContentForAnnotation: function(annotation) {
        const data = annotation.data || {};
        const container = document.createElement("div");
        container.className = "listing-callout";

        const title = document.createElement("div");
        title.className = "listing-callout-title";
        title.textContent = "Grid Listing";
        container.appendChild(title);

        addCalloutRow(container, "Price", data.price);
        addCalloutRow(container, "Owner", data.owner);
        addCalloutRow(container, "Contact", data.contact);
        addCalloutRow(container, "Address", data.address);
        addCalloutRow(container, "Description", data.description);

        if (data.link) {
          const row = document.createElement("div");
          row.className = "listing-callout-row";

          const strong = document.createElement("strong");
          strong.textContent = "Link: ";

          const anchor = document.createElement("a");
          anchor.href = data.link;
          anchor.target = "_blank";
          anchor.rel = "noopener";
          anchor.textContent = "Open";

          row.appendChild(strong);
          row.appendChild(anchor);
          container.appendChild(row);
        }

        return container;
      }
    };

    function addCalloutRow(container, label, value) {
      if (!value) {
        return;
      }

      const row = document.createElement("div");
      row.className = "listing-callout-row";

      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;

      const span = document.createElement("span");
      span.textContent = value;

      row.appendChild(strong);
      row.appendChild(span);
      container.appendChild(row);
    }

    function setStartupZoomedOutRegion() {
      const startupRegion = new mapkit.CoordinateRegion(
        new mapkit.Coordinate(0, 0),
        new mapkit.CoordinateSpan(90, 180)
      );

      map.region = startupRegion;

      requestAnimationFrame(() => {
        map.region = startupRegion;
      });

      setTimeout(() => {
        map.region = startupRegion;
      }, 300);

      setTimeout(() => {
        map.region = startupRegion;
      }, 900);
    }

    function applyMapSettings() {
      map.mapType = hybridMapType;

      if ("showsBuildings" in map) {
        map.showsBuildings = true;
      }

      if ("isRotationEnabled" in map) {
        map.isRotationEnabled = true;
      }

      if ("isPitchEnabled" in map) {
        map.isPitchEnabled = true;
      }
    }

    function getValue(field) {
      if (!field || field.value === undefined || field.value === null) {
        return "";
      }

      return field.value;
    }

    function getPoints(field) {
      const rawPoints = getValue(field);

      if (!Array.isArray(rawPoints)) {
        return [];
      }

      return rawPoints
        .map(point => {
          if (
            typeof point.latitude === "number" &&
            typeof point.longitude === "number"
          ) {
            return [point.latitude, point.longitude];
          }

          if (
            point.value &&
            typeof point.value.latitude === "number" &&
            typeof point.value.longitude === "number"
          ) {
            return [point.value.latitude, point.value.longitude];
          }

          return null;
        })
        .filter(Boolean);
    }

    function polygonCenter(points) {
      let latitude = 0;
      let longitude = 0;

      points.forEach(point => {
        latitude += point[0];
        longitude += point[1];
      });

      return {
        latitude: latitude / points.length,
        longitude: longitude / points.length
      };
    }

    function showStatus(message) {
      if (!message) {
        statusEl.hidden = true;
        statusEl.textContent = "";
        return;
      }

      statusEl.hidden = false;
      statusEl.textContent = message;
    }
  </script>

</body>
</html>
