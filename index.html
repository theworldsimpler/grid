<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grid</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Display:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background-color: #FFFFFF;
      color: #000000;
      font-family: 'Inter Display', sans-serif;
    }

    body {
      padding: 40px;
      line-height: 1.4;
    }

    .section {
      max-width: 900px;
      margin: 0 0 70px 0;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
      margin: 0 0 24px 0;
    }

    p {
      font-size: 1.1rem;
      line-height: 1.4;
      margin: 0 0 18px 0;
    }

    .download-button {
      display: inline-block;
      background-color: #007AFF;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 10px;
      margin-right: 10px;
      margin-bottom: 10px;
    }

    #status {
      margin-bottom: 16px;
      font-size: 1rem;
      color: #555;
    }

    #map {
      width: 100%;
      height: 600px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
    }

    .popup-row {
      margin: 3px 0;
    }
  </style>
</head>

<body>

  <div class="section">
    <h1>Grid</h1>
    <a class="download-button" href="https://apps.apple.com/app/id6773366221">App Store</a>
  </div>

  <div class="section">
    <h1>Land Map</h1>
    <p>View land listings posted on Grid.</p>
    <div id="status">Loading Grid listings...</div>
    <div id="map"></div>
  </div>

  <div class="section">
    <h1>Support</h1>
    <p>Refer to Grid.</p>
  </div>

  <div class="section">
    <h1>Marketing</h1>
    <p>Refer to the App Store.</p>
  </div>

  <div class="section">
    <h1>Privacy Policy</h1>
    <p>Refer to Grid.</p>
  </div>

  <script src="https://cdn.apple-cloudkit.com/ck/2/cloudkit.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const CLOUDKIT_CONTAINER_ID = "iCloud.Grid";
    const CLOUDKIT_API_TOKEN = "PASTE_YOUR_CLOUDKIT_TOKEN_HERE";
    const CLOUDKIT_ENVIRONMENT = "production";

    const statusEl = document.getElementById("status");

    const map = L.map("map").setView([43.6532, -79.3832], 8);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 20,
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    const polygonLayer = L.featureGroup().addTo(map);

    CloudKit.configure({
      containers: [
        {
          containerIdentifier: CLOUDKIT_CONTAINER_ID,
          environment: CLOUDKIT_ENVIRONMENT,
          apiTokenAuth: {
            apiToken: CLOUDKIT_API_TOKEN,
            persist: true
          }
        }
      ]
    });

    async function loadBorders() {
      try {
        const container = CloudKit.getDefaultContainer();
        const database = container.publicCloudDatabase;

        const response = await database.performQuery({
          recordType: "Border",
          desiredKeys: [
            "points",
            "price",
            "owner",
            "contact",
            "address",
            "description",
            "link",
            "areaText",
            "createdDate",
            "expiryDate"
          ]
        });

        const records = response.records || [];
        polygonLayer.clearLayers();

        let renderedCount = 0;

        records.forEach(record => {
          const fields = record.fields || {};
          const points = getPoints(fields.points);

          if (points.length < 3) {
            return;
          }

          const price = getValue(fields.price);
          const owner = getValue(fields.owner);
          const contact = getValue(fields.contact);
          const address = getValue(fields.address);
          const description = getValue(fields.description);
          const link = getValue(fields.link);

          const polygon = L.polygon(points, {
            weight: 3,
            opacity: 0.9,
            fillOpacity: 0.25
          }).addTo(polygonLayer);

          polygon.bindPopup(`
            <div class="popup-title">Grid Listing</div>
            ${price ? `<div class="popup-row"><strong>Price:</strong> ${escapeHTML(price)}</div>` : ""}
            ${owner ? `<div class="popup-row"><strong>Owner:</strong> ${escapeHTML(owner)}</div>` : ""}
            ${contact ? `<div class="popup-row"><strong>Contact:</strong> ${escapeHTML(contact)}</div>` : ""}
            ${address ? `<div class="popup-row"><strong>Address:</strong> ${escapeHTML(address)}</div>` : ""}
            ${description ? `<div class="popup-row"><strong>Description:</strong> ${escapeHTML(description)}</div>` : ""}
            ${link ? `<div class="popup-row"><strong>Link:</strong> <a href="${escapeHTML(link)}" target="_blank" rel="noopener">Open</a></div>` : ""}
          `);

          renderedCount += 1;
        });

        if (renderedCount > 0) {
          map.fitBounds(polygonLayer.getBounds(), {
            padding: [30, 30]
          });

          statusEl.textContent = `Showing ${renderedCount} Grid listing${renderedCount === 1 ? "" : "s"}.`;
        } else {
          statusEl.textContent = "No Grid listings found yet.";
        }
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Could not load Grid listings.";
      }
    }

    function getValue(field) {
      if (!field || field.value === undefined || field.value === null) {
        return "";
      }

      return field.value;
    }

    function getPoints(field) {
      const rawPoints = getValue(field);

      if (!Array.isArray(rawPoints)) {
        return [];
      }

      return rawPoints
        .map(point => {
          if (
            typeof point.latitude === "number" &&
            typeof point.longitude === "number"
          ) {
            return [point.latitude, point.longitude];
          }

          if (
            point.value &&
            typeof point.value.latitude === "number" &&
            typeof point.value.longitude === "number"
          ) {
            return [point.value.latitude, point.value.longitude];
          }

          return null;
        })
        .filter(Boolean);
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadBorders();
  </script>

</body>
</html>
